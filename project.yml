name: Qibla
options:
  bundleIdPrefix: com.shafeek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    DEVELOPMENT_TEAM: ""
targets:
  Qibla:
    type: application
    platform: iOS
    sources:
      - path: QiblaApp
    dependencies:
      - target: QiblaWidget
      - sdk: CoreLocation.framework
      - sdk: WidgetKit.framework
    entitlements:
      path: QiblaApp/Qibla.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shafeek.qibla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shafeek.qibla
        PRODUCT_NAME: Qibla
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "قبلتي"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "تحتاج قبلتي إلى موقعك لحساب اتجاه القبلة الحقيقي ومواقيت الصلاة"
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "تحتاج قبلتي إلى موقعك لحساب اتجاه القبلة الحقيقي ومواقيت الصلاة"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  QiblaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: QiblaWidget
      - path: QiblaApp/Models/PrayerTime.swift
      - path: QiblaApp/Services/PrayerCalculator.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: QiblaWidget/Info.plist
      properties:
        CFBundleDisplayName: "مواقيت الصلاة"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    entitlements:
      path: QiblaWidget/QiblaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shafeek.qibla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shafeek.qibla.widget
        PRODUCT_NAME: QiblaWidget
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Qibla:
    build:
      targets:
        Qibla: all
    run:
      config: Debug
    archive:
      config: Release
